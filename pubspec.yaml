name: lockin_app
description: The ultimate focus & screen-time blocker app
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  firebase_core: ^3.7.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.3
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  flutter_colorpicker: ^1.1.0

  # BLOCKER & ANDROID FEATURES
  permission_handler: ^11.3.1
  installed_apps: ^1.6.0
  app_usage: ^4.0.1
  flutter_accessibility_service: ^1.0.0
  workmanager: ^0.7.0

  # VIBRATION — THIS IS THE ONE THAT WORKS
  flutter_vibrate: ^1.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/icon.png
    - assets/splash/splash_icon.png
    - assets/quotes.json